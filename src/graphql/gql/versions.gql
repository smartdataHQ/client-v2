mutation CreateVersion($object: versions_insert_input!) {
  insert_versions_one(object: $object) {
    id
  }
}

query versionByBranchId($branch_id: uuid!, $limit: Int, $offset: Int) {
  versions(
    limit: $limit
    offset: $offset
    order_by: { created_at: desc }
    where: { branch_id: { _eq: $branch_id } }
  ) {
    id
    checksum
    updated_at
    created_at
    user {
      display_name
    }
    dataschemas(order_by: { name: asc }) {
      created_at
      updated_at
      datasource_id
      id
      user_id
      name
      code
      checksum
      user {
        display_name
      }
      datasource {
        name
      }
    }
  }
  versions_aggregate(where: { branch_id: { _eq: $branch_id } }) {
    aggregate {
      count
    }
  }
}

query CurrentVersion($branch_id: uuid!) {
  versions(
    limit: 1
    offset: 0
    order_by: { created_at: desc }
    where: { branch_id: { _eq: $branch_id } }
  ) {
    id
    checksum
    user {
      display_name
    }
    dataschemas(order_by: { name: asc }) {
      created_at
      updated_at
      datasource_id
      id
      user_id
      name
      code
      checksum
      user {
        display_name
      }
      datasource {
        name
      }
    }
  }
}

subscription VersionsCount($branch_id: uuid!) {
  versions_aggregate(where: { branch_id: { _eq: $branch_id } }) {
    aggregate {
      count
    }
  }
}

query FirstDataschemaAppearance($branch_id: uuid!, $name: String!) {
  versions(
    where: {
      branch_id: { _eq: $branch_id }
      dataschemas: { name: { _eq: $name } }
    }
    order_by: { created_at: asc }
    limit: 1
  ) {
    dataschemas(where: { name: { _eq: $name } }, limit: 1) {
      created_at
      user_id
      user {
        display_name
      }
    }
  }
}
